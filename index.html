<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <meta
      name="description"
      content="DashCore — an analytics dashboard for revenue, customers, orders and team management."
    />
    <title>DashCore — Dashboard</title>
    <script>
      // Apply the saved theme before first paint to prevent a flash of the
      // wrong colour scheme (runs before the bundle loads).
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (prefersDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
